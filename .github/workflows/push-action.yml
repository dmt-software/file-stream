name: build
on: push
jobs:
  test-push-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup php
        uses: shivammathur/setup-php@v2
        with:
          php-version: latest
          coverage: none
          ini-values: >-
            display_errors=On,
            display_startup_errors=On,
            error_reporting=-1,
            zend.assertions=1

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run unit test
        run: composer test